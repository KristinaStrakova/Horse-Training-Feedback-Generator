<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Horse Feedback Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="banner">
        <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Logo" class="logo">
        <h1>Welcome to the Horse Feedback Generator</h1>
    </header>

    <main class="page-layout">
        <div class="main-container">

            <!-- FORM SECTION -->
            <div class="form-sidebar-wrapper">
                <form id="horse-form" method="POST" action="/run_model" class="card narrow-card">
                    <label for="horse-id">Select Horse ID:</label>
                    <select name="horse_id" id="horse-id">
                        <option value="" disabled selected>-- Select Horse ID --</option>
                        {% for hid in horse_ids %}
                            <option value="{{ hid }}">{{ hid }}</option>
                        {% endfor %}
                    </select>
                    <button type="submit">Receive feedback</button>
                </form>
            </div>

            <!-- LOADING INDICATOR -->
            <div id="loading-indicator" style="display: none;">Loading... Please wait.</div>

            <!-- RESULTS CONTAINER (replaced dynamically) -->
            <div id="results-wrapper">
                {% include "_results.html" %}
            </div>

        </div>
    </main>

    <script>
        const form = document.getElementById('horse-form');
        const loading = document.getElementById('loading-indicator');
        const resultWrapper = document.getElementById('results-wrapper');

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            loading.style.display = 'block';
            resultWrapper.innerHTML = '';

            const formData = new FormData(form);
            const response = await fetch('/run_model', {
                method: 'POST',
                body: formData
            });

            const html = await response.text();
            resultWrapper.innerHTML = html;
            loading.style.display = 'none';
        });

        document.addEventListener('change', function (e) {
            if (e.target.id === 'view-mode') {
                const mode = e.target.value;
                document.getElementById('graph-section').style.display = mode === 'graphs' ? 'block' : 'none';
                document.getElementById('summary-section').style.display = mode === 'summary' ? 'block' : 'none';
            }
        });
    </script>
</body>
</html>
